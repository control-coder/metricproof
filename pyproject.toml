[project]
name = "datalab"
version = "0.1.0"
description = "OrderProof：面向电商订单 CSV 的可验证多角色分析助手"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "celery[redis]>=5.4,<6",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    # 图表在可信 worker 中渲染；固定次版本以保证同一结果输出相同 PNG。
    "matplotlib>=3.10.9,<3.11",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# MCP 服务（datalab.api.mcp_server）；接口与 worker 不依赖它。固定版本：SDK 2.x 的服务端接口不同。
mcp = ["mcp==1.30.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["datalab*"]
namespaces = false

[tool.setuptools.package-data]
"datalab.memory" = ["schema.sql"]

"datalab.storage" = ["schema.sql"]

# CI 最小规则集：语法错误与 pyflakes（未定义名、未使用导入/变量等），不引入格式化风格规则。
[tool.ruff]
target-version = "py312"
extend-exclude = ["poirot", "resource", "frontend", "artifacts", ".tmp"]

[tool.ruff.lint]
select = ["E9", "F"]
